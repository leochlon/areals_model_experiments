[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "areal-tokens"
version = "0.6.0"
description = "AREALS: Euler-Lagrange geometry pretraining with areal tokens (code supplement)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
mesh = ["trimesh>=4", "rtree>=1"]
fast = ["numba>=0.59", "libigl>=2.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
areal = "areal_tokens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = ["distributed: two-process CPU/gloo integration test"]
junit_family = "xunit1"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
