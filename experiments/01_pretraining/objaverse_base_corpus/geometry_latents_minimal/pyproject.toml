[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-latents"
version = "0.3.0"
description = "Spatial vector representations for geometry, with masked neural-field pretraining"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]
mesh = ["trimesh>=4", "rtree>=1"]
fast = ["numba>=0.59", "libigl>=2.5"]

[project.scripts]
geometry-latents = "geom_latents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["distributed: two-process CPU/gloo integration test"]
junit_family = "xunit1"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
